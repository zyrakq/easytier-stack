[paths]
extensions_dirs = ["extensions"]

[build]
skip_base_generation =true
env_file_patterns = [".env", ".env.easyvpn"]
extensions = [
    "ipv4",
    "stun",
    "peer",
    "socks5",
    "point-to-network"
]

[build.combos]
"server-node" = ["ipv4", "stun"]
"server-socks5-node" = ["ipv4", "stun", "socks5"]

"p2p-node" = ["ipv4", "peer", "stun", "point-to-network"]

"client-node" = ["ipv4", "peer", "stun"]
"client-socks5-node" = ["ipv4", "peer", "stun", "socks5"]

[build.environments]
available = ["server", "producer", "consumer"]

[build.environments.server]
combos = ["server-node", "server-socks5-node"]

[build.environments.producer]
combos = ["p2p-node"]

[build.environments.consumer]
combos = ["client-node", "client-socks5-node"]

